name: NIRDHOOM CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: nirdhoom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: npm run syntaxcheck
      - run: npm run audit
      - name: Verify generated database migration bundle
        run: npm run db:bundle && git diff --exit-code -- supabase/all-migrations.sql
      - run: npm test
      - run: npm run build
      - name: Install dispatch service dependencies
        run: python -m pip install -r services/dispatch-ortools/requirements.txt
      - name: Check dispatch service Python syntax
        run: python -m compileall -q services/dispatch-ortools
      - name: Test dispatch service
        working-directory: services/dispatch-ortools
        run: python -m unittest test_main.py -v
