name: NIRDHOOM CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: nirdhoom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nirdhoom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nirdhoom_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: nirdhoom_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm run syntaxcheck
      - run: npm run audit
      - name: Verify generated database migration bundle
        run: npm run db:bundle && git diff --exit-code -- supabase/all-migrations.sql
      - run: npm test
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated atomic-completion test database
        run: psql -v ON_ERROR_STOP=1 -f tests/integration/atomic-job-residue-completion-setup.sql
      - name: Apply atomic job completion migration to isolated database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120004_atomic_job_residue_completion.sql
      - name: Exercise authorization, evidence, measurements, rollback and retry behavior
        run: psql -v ON_ERROR_STOP=1 -f tests/integration/atomic-job-residue-completion.test.sql
      - name: Apply consent audit migration to isolated database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120005_consent_audit_immutability.sql
      - name: Exercise consent audit privileges and revocation policy
        run: psql -v ON_ERROR_STOP=1 -f tests/integration/consent-audit-immutability.test.sql
      - run: npm run build
      - name: Install dispatch service dependencies
        run: python -m pip install -r services/dispatch-ortools/requirements.txt
      - name: Check dispatch service Python syntax
        run: python -m compileall -q services/dispatch-ortools
      - name: Test dispatch service
        working-directory: services/dispatch-ortools
        run: python -m unittest test_main.py -v
